<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · DATACAT</title>
<link rel="icon" type="image/png" href="/assets/datacat-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>/* Same saved theme as the dashboard, applied before first paint. */try{var t=localStorage.getItem("datacat-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* Brand colours come from the DATACAT logo (violet #6C28DE); type and neutrals
   (warm greys, IBM Plex Sans) match the dashboard. */
:root {
  color-scheme: light;
  --bg-primary: #f7f7f5; --bg-card: #ffffff;
  --text-primary: #1a1917; --text-secondary: #4d4b46; --text-muted: #6f6d66;
  --brand: #6c28de; --brand-hover: #5b1fc4; --brand-deep: #4c1d95; --brand-light: #8b5cf6;
  --on-brand: #ffffff; --ring: #6c28de;
  --input-bg: #f3effd; --input-border: #8b74d9;
  --decor: rgba(108, 40, 222, .10);
  --danger: #b91c1c; --danger-soft: #fef2f2;
  --hero-text: #ffffff;
  --shadow: 0 30px 70px rgba(76, 29, 149, .18), 0 2px 8px rgba(15, 23, 42, .06);
  --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg-primary: #0f0f0e; --bg-card: #171716;
    --text-primary: #edece8; --text-secondary: #c4c2bb; --text-muted: #93918a;
    --brand: #a78bfa; --brand-hover: #c4b5fd; --on-brand: #1e1438; --ring: #c4b5fd;
    --input-bg: #1a1630; --input-border: #7c64d6; --decor: rgba(167, 139, 250, .10);
    --danger: #f87171; --danger-soft: rgba(239, 68, 68, .12); --shadow: 0 30px 70px rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-primary: #0f0f0e; --bg-card: #171716;
  --text-primary: #edece8; --text-secondary: #c4c2bb; --text-muted: #93918a;
  --brand: #a78bfa; --brand-hover: #c4b5fd; --on-brand: #1e1438; --ring: #c4b5fd;
  --input-bg: #1a1630; --input-border: #7c64d6; --decor: rgba(167, 139, 250, .10);
  --danger: #f87171; --danger-soft: rgba(239, 68, 68, .12); --shadow: 0 30px 70px rgba(0, 0, 0, .55);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  min-height: 100vh; min-height: 100dvh;
  font-family: var(--font-sans); color: var(--text-primary); background: var(--bg-primary);
  -webkit-font-smoothing: antialiased;
}

/* Full-screen split: violet welcome panel with a curved edge, form on the right */
.card {
  position: relative; width: 100%; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
  background: var(--bg-card); overflow: hidden;
}
.card::after { /* soft violet arc in the top-right corner, echoing the hero curve */
  content: ''; position: absolute; top: -190px; right: -190px; width: 420px; height: 420px; border-radius: 50%;
  border: 56px solid var(--decor); pointer-events: none;
}
.card::before { /* a smaller echo in the bottom-right corner */
  content: ''; position: absolute; bottom: -90px; right: 18%; width: 180px; height: 180px; border-radius: 50%;
  background: var(--decor); pointer-events: none;
}
.hero {
  position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; padding: 64px 96px 64px 48px; text-align: center; color: var(--hero-text);
  background: linear-gradient(160deg, var(--brand-light) 0%, #6c28de 45%, var(--brand-deep) 100%);
  border-top-right-radius: 220px 50%; border-bottom-right-radius: 220px 50%;
}
.hero::before { /* faint concentric rings behind the logo */
  content: ''; position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; margin: -300px 0 0 -230px; border-radius: 50%;
  background: radial-gradient(circle, transparent 54%, rgba(255, 255, 255, .06) 55%, transparent 56%, transparent 72%, rgba(255, 255, 255, .05) 73%, transparent 74%);
  pointer-events: none;
}
.logo { position: relative; width: 120px; height: 120px; padding: 5px; border-radius: 50%; background: #fff; box-shadow: 0 12px 30px rgba(30, 10, 80, .35); }
.logo img { display: block; width: 100%; height: 100%; border-radius: 50%; }
.brand-name { position: relative; font-size: 17px; font-weight: 700; letter-spacing: .2em; }
.hero h2 { position: relative; margin-top: 12px; font-size: clamp(32px, 3.2vw, 44px); font-weight: 700; line-height: 1.15; }

.panel { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 64px 48px; }
.panel-inner { width: 100%; max-width: 380px; text-align: center; }
.panel h1 { font-size: clamp(32px, 3vw, 42px); font-weight: 700; color: var(--brand); line-height: 1.1; }
.panel .sub { margin-top: 8px; font-size: 14px; color: var(--text-muted); }
form { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; text-align: left; }
.field label { display: block; margin: 0 0 6px 18px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.input-wrap { position: relative; }
.input-wrap svg.lead { position: absolute; left: 18px; top: 50%; width: 18px; height: 18px; margin-top: -9px; stroke: var(--brand); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
input[type=text], input[type=password] {
  width: 100%; height: 48px; padding: 0 50px 0 48px; font: inherit; font-size: 15px; color: var(--text-primary);
  background: var(--input-bg); border: 1.5px solid var(--input-border); border-radius: 999px;
  transition: border-color .15s, box-shadow .15s, background-color .15s;
}
input:hover { border-color: var(--brand); }
input:focus { outline: none; border-color: var(--ring); background: var(--bg-card); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ring) 22%, transparent); }
input[aria-invalid=true] { border-color: var(--danger); background: var(--danger-soft); }
.toggle { position: absolute; right: 8px; top: 6px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .15s, background-color .15s; }
.toggle:hover { color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, transparent); }
.toggle:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.error { min-height: 20px; font-size: 13px; color: var(--danger); display: flex; align-items: flex-start; gap: 8px; padding: 0 18px; }
.error[hidden] { display: none; }
button.submit {
  align-self: center; width: 100%; height: 48px; margin-top: 6px; border: 0; border-radius: 999px; cursor: pointer;
  font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .04em; color: var(--on-brand);
  background: var(--brand); box-shadow: 0 10px 22px color-mix(in srgb, var(--brand) 32%, transparent);
  transition: background-color .15s, box-shadow .15s, opacity .15s;
}
button.submit:hover { background: var(--brand-hover); }
button.submit:disabled { opacity: .65; cursor: progress; }
button.submit:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
.note { margin-top: 24px; font-size: 13px; color: var(--text-muted); line-height: 1.6; }

/* Tablet and phone: violet header with a curved bottom, form below */
@media (max-width: 860px) {
  .card { grid-template-columns: 1fr; align-content: start; }
  .card::after, .card::before { display: none; }
  .hero {
    padding: 40px 24px 56px; gap: 12px;
    border-radius: 0 0 50% 50% / 0 0 48px 48px;
  }
  .hero::before { top: 40%; width: 340px; height: 340px; margin: -200px 0 0 -170px; }
  .logo { width: 84px; height: 84px; }
  .hero h2 { margin-top: 4px; font-size: 26px; }
  .panel { padding: 32px 24px 44px; }
  .panel h1 { font-size: 28px; }
  input[type=text], input[type=password] { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="card">
  <section class="hero">
    <div class="logo"><img src="/assets/datacat-logo.png" alt="" width="86" height="86"></div>
    <div class="brand-name">DATACAT</div>
    <h2>Welcome back!</h2>
  </section>

  <section class="panel">
    <div class="panel-inner">
    <h1>Sign in</h1>
    <p class="sub">Sign in to your administrator account to continue</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg class="lead" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
          <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
        </div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="lead" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" id="eye" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <p class="error" id="error" role="alert" hidden></p>
      <button class="submit" type="submit" id="submit">Sign in</button>
    </form>
    <p class="note">Sessions expire automatically. Forgot your password? Ask a system administrator to reset it.</p>
    </div>
  </section>
</main>
<script>
(function () {
  const form = document.getElementById('loginForm');
  const userInput = document.getElementById('username');
  const passInput = document.getElementById('password');
  const errorBox = document.getElementById('error');
  const submit = document.getElementById('submit');
  const toggle = document.getElementById('toggle');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
    [userInput, passInput].forEach((el) => el.setAttribute('aria-invalid', 'true'));
  }
  function clearError() {
    errorBox.hidden = true;
    [userInput, passInput].forEach((el) => el.removeAttribute('aria-invalid'));
  }
  [userInput, passInput].forEach((el) => el.addEventListener('input', clearError));

  toggle.addEventListener('click', () => {
    const reveal = passInput.type === 'password';
    passInput.type = reveal ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(reveal));
    toggle.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
  });

  // Only a same-site dashboard fragment is honoured, never a full URL.
  const next = new URLSearchParams(window.location.search).get('next') || '';
  const hash = /^#[a-z]{3,16}$/.test(next) ? next : '';

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const username = userInput.value.trim();
    if (!username || !passInput.value) {
      showError('Enter your username and password.');
      (username ? passInput : userInput).focus();
      return;
    }
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password: passInput.value }),
      });
      if (res.ok) {
        window.location.replace('/dashboard' + hash);
        return;
      }
      // The API answers in Vietnamese; this page shows its own English message per status.
      const messages = {
        401: 'Incorrect username or password.',
        429: 'Too many sign-in attempts. Please wait a few minutes and try again.',
        503: 'Sign-in is temporarily unavailable. Please try again shortly.',
      };
      showError(messages[res.status] || 'Unable to sign in. Please try again.');
      passInput.value = '';
      passInput.focus();
    } catch (e) {
      showError('Cannot reach the server. Check your connection and try again.');
    } finally {
      submit.disabled = false;
      submit.textContent = 'Sign in';
    }
  });
})();
</script>
</body>
</html>
