services:
  bot-detection-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-detection-api
    ports:
      # Public traffic reaches the API through the HTTPS gateway; the port stays host-local.
      - "127.0.0.1:8000:8000"
    environment:
      - BOT_API_HOST=0.0.0.0
      - BOT_API_PORT=8000
      - BOT_API_WORKERS=1
      - BOT_TELEMETRY_SPOOL_PATH=/app/var/telemetry-spool.sqlite
      - BOT_CORS_ORIGINS=${BOT_CORS_ORIGINS:-https://silkmoon.datacat.io.vn}
      - BOT_DECISION_THRESHOLD=0.96
      - BOT_SUSPECT_THRESHOLD=0.45
      - BOT_MIN_MOUSE_POINTS_FOR_BOT=25
      - BOT_DATA_RETENTION_DAYS=${BOT_DATA_RETENTION_DAYS:-30}
      - BOT_CAPTURE_ENABLED=${BOT_CAPTURE_ENABLED:-false}
      - BOT_CAPTURE_RETENTION_DAYS=${BOT_CAPTURE_RETENTION_DAYS:-7}
      # Phone/tablet gestures (geometry and timing only) kept as training data.
      - BOT_TOUCH_CAPTURE=${BOT_TOUCH_CAPTURE:-true}
      - BOT_TOUCH_RETENTION_DAYS=${BOT_TOUCH_RETENTION_DAYS:-180}
      # Offline IP geolocation (DB-IP Lite, CC BY 4.0), refreshed monthly into the volume.
      - BOT_GEOIP_DIR=/app/var/geoip
      - BOT_GEOIP_AUTO_UPDATE=${BOT_GEOIP_AUTO_UPDATE:-true}
      - BOT_TRUST_PROXY_HEADERS=true
      - BOT_TRUSTED_PROXIES=172.16.0.0/12
      - BOT_ADMIN_TOKEN=${BOT_ADMIN_TOKEN:-}
      - BOT_READ_TOKEN=${BOT_READ_TOKEN:-}
      - BOT_SESSION_SECRET=${BOT_SESSION_SECRET:-}
      - BOT_SESSION_TTL_HOURS=${BOT_SESSION_TTL_HOURS:-12}
      - BOT_TELEMETRY_ORIGINS=${BOT_TELEMETRY_ORIGINS:-}
      - BOT_DETECT_RESPONSE=${BOT_DETECT_RESPONSE:-full}
      - MONGO_URI=${MONGO_URI:-mongodb://silkmoon-mongodb:27017}
      - MONGO_DB=${MONGO_DB:-bot_detection}
    restart: unless-stopped
    volumes:
      - bot_detection_spool:/app/var
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: silkmoon-network

volumes:
  bot_detection_spool:
