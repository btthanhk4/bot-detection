user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" $host';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Gzip settings for responses returned to clients
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Max upload size (matching NestJS 15MB limit with headroom)
    client_max_body_size 25M;

    # TLS (Let's Encrypt, renewed by certbot.timer on the host)
    ssl_certificate     /etc/letsencrypt/live/datacat.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datacat.io.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- DATACAT gateway integration (policy 24) ----------------------------------
    # Defines $datacat_gateway_secret; kept out of this file (and out of git).
    include /etc/nginx/datacat-gateway.conf;

    # HTML documents get a page-view id; scripts, styles and media do not.
    map $request_uri $datacat_is_asset {
        default 0;
        "~*^[^?]*\.(?:js|mjs|css|map|json|txt|xml|ico|png|jpe?g|gif|webp|avif|svg|woff2?|ttf|otf|eot|mp4|webm|glb|gltf|usdz|wasm)(?:\?|$)" 1;
    }
    map $datacat_is_asset $datacat_pv_cookie {
        0 "__dc_pv=$request_id; Path=/; Secure; HttpOnly; SameSite=Lax";
        default "";
    }
    # ---------------------------------------------------------------------------------

    # Upstream containers in Docker network
    upstream frontend_upstream {
        server silkmoon-frontend:80;
    }

    upstream backend_upstream {
        server silkmoon-backend:3000;
    }

    upstream bot_api_upstream {
        server bot-detection-api:8000;
    }

    upstream admin_upstream {
        server silkmoon-admin:80;
    }

    # 0. PLAIN HTTP: ACME challenges, everything else moves to HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://silkmoon.datacat.io.vn$request_uri;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name datacat.io.vn www.datacat.io.vn api.datacat.io.vn silkmoon.datacat.io.vn;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Unknown hosts on 443 (e.g. https://<ip>, old links) go to the shop
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;
        return 301 https://silkmoon.datacat.io.vn$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.datacat.io.vn;
        return 301 https://datacat.io.vn$request_uri;
    }

    # DATACAT API, collector SDK and telemetry for any integrated website
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.datacat.io.vn;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Gateway-only endpoints are never reachable from outside.
        location ~ ^/api/v1/(pageview|gate)$ {
            return 404;
        }

        location / {
            proxy_pass http://bot_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # DATACAT admin dashboard (metrics) on the apex domain
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name datacat.io.vn;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = / {
            return 302 /dashboard;
        }

        location ~ ^/api/v1/(pageview|gate)$ {
            return 404;
        }

        location / {
            proxy_pass http://bot_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # SilkMoon admin panel: TLS on its old port (it used to be plain HTTP there, so the
    # admin password crossed the network in clear text). Plain HTTP on 5175 is redirected.
    server {
        listen 5175 ssl;
        listen [::]:5175 ssl;
        http2 on;
        server_name _;
        add_header Strict-Transport-Security "max-age=31536000" always;
        error_page 497 =301 https://silkmoon.datacat.io.vn:5175$request_uri;

        location / {
            proxy_pass http://admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # SilkMoon storefront
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name silkmoon.datacat.io.vn;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # 1. BOT DETECTION TELEMETRY INGESTION ENDPOINT (old path, kept for cached pages)
        location /api/v1/telemetry {
            proxy_pass http://bot_api_upstream/api/v1/telemetry;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. BOT COLLECTOR SDK SCRIPT (old path, kept for cached pages)
        location = /bot-collector.js {
            proxy_pass http://bot_api_upstream/bot-collector.js;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=3600";
        }

        # 2b. DATACAT collector and telemetry on neutral first-party paths: blocklists
        # match names such as "bot-collector" and "telemetry".
        location = /_dc/c.js {
            proxy_pass http://bot_api_upstream/bot-collector.js;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=300";
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        location = /_dc/t {
            proxy_pass http://bot_api_upstream/api/v1/telemetry;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2c. DATACAT page-view mirror and action gate (internal only).
        location = /__datacat_pv {
            internal;
            if ($datacat_is_asset) {
                return 204;
            }
            proxy_pass http://bot_api_upstream/api/v1/pageview;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Datacat-Gateway $datacat_gateway_secret;
            proxy_set_header X-Datacat-PV $request_id;
            proxy_set_header X-Original-URI $request_uri;
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }

        location = /__datacat_gate {
            internal;
            proxy_pass http://bot_api_upstream/api/v1/gate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Datacat-Gateway $datacat_gateway_secret;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
            # Fail open: the shop keeps working if DATACAT is down, slow, or not configured (404).
            proxy_intercept_errors on;
            error_page 404 500 502 503 504 = @datacat_gate_open;
        }

        location @datacat_gate_open {
            return 204;
        }

        location @datacat_denied {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000" always;
            return 403 '{"statusCode":403,"error":"Forbidden","message":"Yêu cầu bị hệ thống chống bot chặn. Hãy tải lại trang rồi thử lại."}';
        }

        # 3a. SHOP WRITES THAT BOTS ABUSE: credential stuffing, sign-up and OTP spam, fake
        # orders, coupon guessing, review and comment spam, paid AI features.
        location ~ ^/api/v1/(auth/(login|register|verify-registration|resend-registration-otp|forgot-password|reset-password)|orders|reviews|blog/comments|newsletter/subscriptions|promotions/validate|assistant/chat|ar/[a-z-]+)$ {
            auth_request /__datacat_gate;
            error_page 403 = @datacat_denied;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. SILKMOON BACKEND API (NestJS)
        location /api/v1/ {
            proxy_pass http://backend_upstream/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. SILKMOON UPLOADED ASSETS & AR 3D MODELS
        location /uploads/ {
            proxy_pass http://backend_upstream/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 5. SILKMOON FRONTEND WITH ZERO-CODE SDK INJECTION
        location / {
            # DATACAT: record the page view and hand the browser its id (HTML only).
            mirror /__datacat_pv;
            mirror_request_body off;
            add_header Set-Cookie $datacat_pv_cookie;
            # A location with its own add_header does not inherit the server's.
            add_header Strict-Transport-Security "max-age=31536000" always;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable upstream gzip so sub_filter can read and transform plain HTML
            proxy_set_header Accept-Encoding "";

            # AUTOMATIC ZERO-CODE INJECTION: the collector starts itself from the tag and
            # keeps its instance private (no page-level variable to rewrite).
            sub_filter '</body>' '<script src="/_dc/c.js" data-datacat-embed data-endpoint="/_dc/t" data-interval-ms="5000"></script></body>';
            sub_filter_once on;
        }
    }
}
