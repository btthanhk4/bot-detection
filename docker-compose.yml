services:
  bot-detection-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-detection-api
    ports:
      - "8000:8000"
    environment:
      - BOT_API_HOST=0.0.0.0
      - BOT_API_PORT=8000
      - BOT_API_WORKERS=1
      - BOT_CORS_ORIGINS=${BOT_CORS_ORIGINS:-http://159.223.91.163}
      - BOT_DECISION_THRESHOLD=0.70
      - BOT_SUSPECT_THRESHOLD=0.45
      - BOT_TRUST_PROXY_HEADERS=true
      - BOT_TRUSTED_PROXIES=172.16.0.0/12
      - BOT_ADMIN_TOKEN=${BOT_ADMIN_TOKEN:-}
      - BOT_READ_TOKEN=${BOT_READ_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: silkmoon-network
