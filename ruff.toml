# Ruff settings shared by local runs and CI (`python -m ruff check .`).
target-version = "py310"
extend-exclude = ["bot-lab", "var"]

[lint]
# Ruff's default rule set plus import ordering.
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["api_service", "core_ml", "simulator", "tests"]
