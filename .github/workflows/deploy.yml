name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            details="$(tail -n 80 pytest.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=pytest failed::$details"
            exit "$status"
          fi

      - name: Build collector
        working-directory: collector
        run: npm run build

      - name: Verify generated collector is committed
        run: git diff --exit-code -- collector/dist/bot-collector.js

  deploy:
    name: Deploy production
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy exact tested commit
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          command_timeout: 15m
          envs: DEPLOY_PATH,DEPLOY_SHA,BOT_ADMIN_TOKEN
          script: |
            set -Eeuo pipefail

            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "DEPLOY_PATH secret is required"
              exit 1
            fi

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "No Git repository found at $DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Deployment repository has uncommitted tracked changes"
              git status --short
              exit 1
            fi

            git fetch --prune origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git checkout --detach "$DEPLOY_SHA"

            export BOT_ADMIN_TOKEN
            docker compose up -d --build --remove-orphans
            docker compose ps

            for attempt in $(seq 1 18); do
              health="$(docker compose exec -T bot-detection-core \
                curl -fsS http://localhost:8000/health 2>/dev/null || true)"

              if printf '%s' "$health" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
                echo "Deployment is healthy: $health"
                exit 0
              fi

              echo "Waiting for healthy service ($attempt/18): ${health:-no response}"
              sleep 5
            done

            echo "Deployment health check failed"
            docker compose logs --tail=100 bot-detection-core
            exit 1
